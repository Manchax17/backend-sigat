name: Mirror to GitLab

on:
  push:
    branches: [ "develop" ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/manchax2005/backend-fork-sigat.git
          git push --force gitlab develop:develop
